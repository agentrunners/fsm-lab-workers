# fsm-watchdog — the chain-health backstop. Read-only over state; its only
# powers are DISPATCH (re-prime) and ALERT-ISSUE. Never a state writer.
#
# Cadence: schedule (intermittent by nature — acceptable for a backstop) +
# manual. The conductor chain is the primary driver; this catches dead links.
# Circuit breaker: 3+ re-primes in 30min while still stale -> stop re-priming
# and open ONE alert issue (deduped by label).
name: fsm-watchdog

run-name: "scan · watchdog"

on:
  schedule:
    # :03 offset avoids the :00/:30 delay hotspot; ~6 scans/hour
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: fsm-watchdog
  cancel-in-progress: false

permissions:
  contents: write   # state fetch (read) + re-prime dispatch POST
  issues: write      # alert issues / comments

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Watchdog scan
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_PAT: ${{ secrets.LAB_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STALE_AFTER_MIN: '4'
          # s21/A-3: the deadman-marker heartbeat throttle (minutes) — one
          # audit-only `watchdog-scan-<ms>` journal record per completed scan,
          # at most one per WATCHDOG_MARKER_MIN; the pinger-watch duty alarms
          # when the markers stop (WATCHDOG_STALE_AFTER_MIN, default 5h — s22/R2-1: 180min was nominal-cadence arithmetic, the A-1 mistake on the deadman).
          WATCHDOG_MARKER_MIN: '55'
          # T46/W-C2 (§5a, F-15): transcript retention knob — default 7 days;
          # the scan HARD-CAPS at 90 (values >90 clamp, <1 or invalid reset
          # to the default) regardless of what lands here.
          TRANSCRIPT_GC_DAYS: '7'
        run: node watchdog/scan.mjs
