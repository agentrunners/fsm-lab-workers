# fsm-worker — the agent seat. One run = one task attempt.
#
# Receives the turn envelope via fsm-task dispatch (client_payload). T46/W-B
# §1c MODE routing (worker/turn.mjs):
#   mode=mock (default) — the deterministic harness shim (sim/harness-shim.mjs):
#     CP.behavior drives the seeded behavior set (fast/slow/poison/infra-flaky/
#     deadline/hang/dup-report/wb-violation + the legacy vocabulary as aliases).
#   mode=real — one OpenRouter completion on the env-driven model chain
#     (OPENROUTER_MODEL, then the free defaults) with one fallback hop on
#     infra-class failure, bounded by budget.lane_attempts.
#   mode=cc — the CC adapter (worker/cc-adapter.mjs, T46/W4): the
#     claude-code CLI turn on the key-pool × model-chain lanes (D2), the
#     F-M8 OpenRouter bridge env, the process-group wall kill at the
#     deadline, transcripts to fsm-sessions BEFORE the report, the
#     write-back door on artifacts. CC_FAKE_LLM=1 swaps the CLI for
#     worker/fake-cc.mjs (deterministic fixtures — never set in live
#     dispatches; the X20 smoke is the only real-lane execution).
#   mode=codex — the CODEX adapter (worker/codex-adapter.mjs, s24/B2): the
#     codex exec turn on the key-pool × models-table lanes (D5a model-major
#     [k1/ds,k2/ds,k1/glm,k2/glm]), CODEX_HOME=$HOME/.codex-fsm + config.toml
#     rendered by the codex-install step below (s24/B3, D7a — never /tmp,
#     never in the workdir), the D14 env overlay (the lane key is the ONLY
#     credential the child holds), the JSONL event decode (R7 event-wins,
#     D13's terminal exit-2) + transcripts with harness:'codex' provenance.
#     CODEX_FAKE_LLM=1 swaps the CLI for worker/fake-codex.mjs (deterministic
#     fixtures — never set in live dispatches; the conformance suite's lane).
# EVERY mode passes the LAW-1 START-GATE first (envelopeFromDispatch): an
# already-expired deadline → one infra_failed 'late-start' report, exit 0 —
# the lease is never burned on a guaranteed orphan.
#
# NEVER writes state and NEVER dispatches — it reports by CAS-appending a
# line to state/reports-queue.jsonl (data through git; the tick drains it
# atomically). The lease token in the report is the validity claim:
# stale/duplicate reports are absorbed by the conductor (orphan/dedup).
# If the enqueue itself fails (after retry), the payload is written to the
# run's step summary (the visible-waste lane) and the run exits 2.
#
# TTL wall: timeout-minutes kills hangs; the CONDUCTOR's lease deadline is
# the semantic backstop (retry / quarantine). The job dying "successfully
# but silent" (no-report behavior) is a first-class failure class the FSM
# handles by design — this is the at-least-once contract.
#
# T45/F-G(e) — the TTL-kill SIGNATURE (porting contract): a timeout-minutes
# kill presents as conclusion=CANCELLED (NOT failure) with a step duration ≈
# timeout-minutes (live datum 34073438112: step 20m03s, cancelled). In-lab
# the lease/quarantine path is the handler BY DESIGN — the run conclusion is
# cosmetic; any failure-watch porting this contract must count
# cancelled-at-TTL as the kill class.
#
# T44/X14: 20min >= lease(15, real lane) + report margin. The real-LLM lane
# runs with lease_minutes=15 (configure control) — mock lane lease is 4min
# but a generous job TTL costs nothing on a public repo and removes the
# spurious-kill class entirely.
name: fsm-worker

run-name: "task-${{ github.event.client_payload.task }} · ${{ github.event.client_payload.behavior }} · a${{ github.event.client_payload.attempt }}"

on:
  repository_dispatch:
    types: [fsm-task]

concurrency:
  group: fsm-worker-${{ github.event.client_payload.task }}
  # SUPERSESSION semantics: a reassigned attempt (newer lease) CANCELS the
  # older hanging run for the same task — the retry supersedes, and a hung
  # runner dies at reassignment instead of blocking its replacement for the
  # full timeout window.
  cancel-in-progress: true

permissions:
  contents: write   # the report-queue CAS push (git push via the checkout creds)

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # T46/X21: the wall can be lease-2min (45-lease epochs); was 20 (the 15-lease era)
    steps:
      # T46/ar (20-e) + s25/b1 (the X29 F2 correction): TARGET_REPO redirects
      # the seat — the second bucket's workers (agentrunners/fsm-lab-workers)
      # check out the MAIN repo so the task-branch push, the transcript push
      # and the report-queue CAS-append all land THERE. The report push rides
      # the checkout's own origin (lib/store.mjs — follows the checkout by
      # construction, no env seam needed); the transcript + task-branch pushes
      # ride the FSM_SESSIONS_REPO + FSM_SESSIONS_TOKEN CUSTOM names below.
      # THE CORRECTED LAW (the X29 live lesson, run 35999041887): the old
      # GITHUB_REPOSITORY + GH_TOKEN step-env mapping RENDERED the re-target
      # in the step's env listing but never reached the process — step-env
      # overrides of GITHUB_* default names are silently ignored by the
      # runner — so 6 of 34 X29 runs silently pushed transcripts/artifacts to
      # the MIRROR repo (the record-of-record split). Custom names are the
      # only reliable seam. Unset = own repo on the ephemeral job token —
      # today's behavior, byte-identical.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TARGET_REPO || github.repository }}
          # The PAT lane only when redirected (cross-repo checkout + the
          # pushes the job token cannot make); the job token otherwise.
          token: ${{ vars.TARGET_REPO && secrets.LAB_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # T46/X21: claude-code 2.1.273 requires >=22 (the adapter's npx spawns on the system node)

      - name: Install the CC CLI (cc-mode dispatches only — once per job)
        # X21 live finding: a fresh npx download took ~7 MINUTES on the worker
        # runner (vs 4-9s via npm install -g in the X20 smoke) — the wall
        # budget must buy WORK, not package downloads.
        # m-9/C (R2-FIX): the ox envelope's mode gates the install (mock
        # dispatches skip it); unparseable/absent ox = legacy dispatch =
        # install anyway, fail-safe. m-2/C: no `|| true` — a failed install
        # fails the job LOUDLY (the lease re-covers; a silent failure pays
        # the 7-min npx tax inside the wall instead). The payload rides ENV
        # (never ${{ }}-interpolated into the shell — injection-safe).
        env:
          CC_VERSION: ${{ vars.CC_VERSION }}
          OX_RAW: ${{ github.event.client_payload.ox || '' }}
        run: |
          MODE=$(printf '%s' "$OX_RAW" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const o=JSON.parse(s);console.log(typeof o==="object"&&o?String(o.mode||""):"")}catch{console.log("")}})')
          if [ "$MODE" = "cc" ] || [ -z "$MODE" ]; then
            # s21/W2 (a2): the install default IS the adapter's M-4 pin
            # (ccCliVersion() in worker/cc-adapter.mjs → 2.1.273), never
            # 'latest' — an unset vars.CC_VERSION used to install @latest
            # while the spawn argv pinned 2.1.273: npx could not use the
            # global install and paid a fresh package download INSIDE the
            # wall budget (the ~7-min m-9 tax this step exists to avoid).
            # Keep in sync with ccCliVersion() — pinned by
            # tests/test-cc-adapter.mjs (the install/spawn alignment pin).
            CC_PIN="${CC_VERSION:-2.1.273}"
            npm install -g "@anthropic-ai/claude-code@${CC_PIN}"
            INSTALLED="$(claude --version)"
            echo "CC-CLI-VERSION ${INSTALLED} (pin ${CC_PIN})"
            case "$INSTALLED" in
              *"$CC_PIN"*) ;;
              *) echo "::error::claude --version (${INSTALLED}) does not match the pin ${CC_PIN} — refusing to let the spawn lane pay a fresh npx download inside the wall budget (s21/W2)"; exit 1;;
            esac
          else
            echo "INSTALL-SKIPPED mode=$MODE (non-cc dispatch — no CC CLI needed)"
          fi

      - name: Install the Codex CLI (codex-mode dispatches only — once per job)
        # s24/B3 (D7a): the second engine's install — the CC step's discipline
        # VERBATIM (m-9/C: the ox envelope's mode gates the install, riding
        # ENV — never ${{ }}-interpolated into the shell, injection-safe;
        # m-2/C: no `|| true` — a failed install fails the job LOUDLY, the
        # lease re-covers). ONE inversion vs the CC gate: the gate is
        # codex-ONLY — the CC step installs fail-safe on an ABSENT ox (absent
        # = legacy = the pre-ox dispatches were cc), but a codex dispatch
        # ALWAYS carries ox.mode='codex' (the B1 vocabulary — an absent mode
        # defaults to 'mock' at envelopeFromDispatch), so mock/real/cc/legacy
        # dispatches NEVER pay the codex install. The npm pin (never latest)
        # is the X21 m-9 lesson: an unpinned install pays a fresh package
        # download INSIDE the wall budget. CODEX_VERSION is the OPTIONAL repo
        # variable (default 0.156.0 — the codex-harness pins.env verified pin;
        # worker/codex/config.toml's wire_api="responses" is mandatory on
        # 0.156). Unlike CC (whose spawn argv pins the version via npx, so
        # CC_VERSION rides BOTH this file's install + spawn env), the codex
        # adapter spawns the INSTALLED `codex` binary (env.CODEX_BIN override)
        # — CODEX_VERSION is install-only, the mirror sync carries it to the
        # second bucket as a repo VARIABLE (R4: the mirror vars parity).
        env:
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
          OX_RAW: ${{ github.event.client_payload.ox || '' }}
        run: |
          MODE=$(printf '%s' "$OX_RAW" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const o=JSON.parse(s);console.log(typeof o==="object"&&o?String(o.mode||""):"")}catch{console.log("")}})')
          if [ "$MODE" = "codex" ]; then
            CODEX_PIN="${CODEX_VERSION:-0.156.0}"
            # CODEX_HOME (D7a): $HOME/.codex-fsm — NEVER /tmp (helper-binary
            # PATH aliases refuse /tmp, gotcha §10.2), NEVER inside a workdir
            # (R1's law: nothing codex-owned lands where scanWorkdir claims).
            # Created + config rendered BEFORE the version assert so a failed
            # assert still leaves the home provably wired; the adapter
            # mkdirSync's it again defensively (codex-adapter.mjs gotcha #2).
            # Exported via GITHUB_ENV (GitHub's env mapping cannot expand
            # $HOME): the "Work the task" step's node process then reads
            # process.env.CODEX_HOME — the adapter's resolution order (a
            # non-empty env.CODEX_HOME wins; absent = its turn-scoped scratch
            # fallback, never reached on a dispatch that passed this gate).
            CODEX_HOME_DIR="$HOME/.codex-fsm"
            mkdir -p "$CODEX_HOME_DIR"
            if [ ! -f worker/codex/config.toml ]; then
              echo "::error::worker/codex/config.toml missing from the checkout — the codex config render cannot proceed (the engine's committed template, s24/B3)"
              exit 1
            fi
            cp worker/codex/config.toml "${CODEX_HOME_DIR}/config.toml"
            echo "CODEX_HOME=${CODEX_HOME_DIR}" >> "$GITHUB_ENV"
            echo "CODEX-CONFIG-RENDERED ${CODEX_HOME_DIR}/config.toml (wire_api responses · env_key OPENROUTER_API_KEY)"
            T0=$(date +%s)
            npm install -g "@openai/codex@${CODEX_PIN}"
            INSTALLED="$(codex --version)"
            T1=$(date +%s)
            echo "CODEX-CLI-VERSION ${INSTALLED} (pin ${CODEX_PIN}) · install $((T1-T0))s (the ~9-16s npm expectation — minutes = the m-9 class)"
            case "$INSTALLED" in
              *"$CODEX_PIN"*) ;;
              *) echo "::error::codex --version (${INSTALLED}) does not match the pin ${CODEX_PIN} — refusing to let the spawn lane pay a fresh npx download inside the wall budget (s24/B3, the m-9 class)"; exit 1;;
            esac
          else
            echo "CODEX-INSTALL-SKIPPED mode=$MODE (non-codex dispatch — no codex CLI needed)"
          fi

      - name: Mask the key-pool secrets (per split key)
        # T46/W-D review fold (A5, lens-2 F3): GitHub auto-masks only the
        # JOINED secret string — the ~68 individual pool keys would render in
        # cleartext if any future log/error/tool output ever quoted ONE key.
        # Registering a mask per key (defense-in-depth at the workflow layer;
        # the denylist prevents env INHERITANCE, not log ECHO) makes any
        # future single-key appearance render as ***. Fails harmless on an
        # empty pool (var unset / secret absent). The values themselves are
        # never echoed — only the ::add-mask:: registration.
        env:
          POOL_RAW: ${{ secrets.OPENROUTER_KEY_POOL || '' }}
        run: |
          if [ -n "$POOL_RAW" ]; then
            printf '%s\n' "$POOL_RAW" | tr ',' '\n' | while IFS= read -r k; do
              k="$(printf '%s' "$k" | xargs)"
              if [ -n "$k" ]; then echo "::add-mask::${k}"; fi
            done
          fi

      - name: Work the task
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # s25/b1 (the X29 F2 fix — THE GITHUB_* OVERRIDE LAW): the sessions
          # push targets (fsm-sessions transcripts + the tasks/<id> write-back)
          # follow the CHECKOUT target through CUSTOM names. The law: step-env
          # overrides of GITHUB_* default names are SILENTLY IGNORED by the
          # runner — the step's env listing RENDERS the override in the log
          # while the spawned process keeps the real value (the X29 live
          # lesson: run 35999041887 rendered GITHUB_REPOSITORY:
          # claudecode-headless/fsm-lab and pushed To
          # https://github.com/agentrunners/fsm-lab-workers.git). Custom names
          # are the only reliable seam. (GH_TOKEN is NOT a protected name —
          # its override worked; the failure was repo-selection only, which
          # is exactly why the old split was SILENT.) The adapters resolve
          # FSM_SESSIONS_REPO/FSM_SESSIONS_TOKEN first, falling back to the
          # GITHUB_REPOSITORY/GH_TOKEN back-compat pair (worker/
          # sessions-push.mjs). Unset TARGET_REPO = github.repository + the
          # job token — byte-identical to today. The report-queue push needs
          # no mapping: it rides the checkout's own origin (lib/store.mjs).
          FSM_SESSIONS_REPO: ${{ vars.TARGET_REPO || github.repository }}
          FSM_SESSIONS_TOKEN: ${{ vars.TARGET_REPO && secrets.LAB_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # T45/F-E: GITHUB_RUN_ID is STABLE across re-runs — only the attempt
          # increments. The report id is attempt-scoped (rep-<run>-a<attempt>)
          # so a re-run's report is never dedup-swallowed. GITHUB_RUN_ATTEMPT
          # IS a default env var, but the mapping keeps the contract explicit.
          # s25/b1: these two ARE GITHUB_* names — the override law says they
          # never reach the process — but they are SAME-VALUE no-ops (the
          # runner's own run_id/run_attempt are exactly these values): kept
          # as harmless contract documentation, never load-bearing.
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          # T45/F-G(a): the mock sleep cap = WORKER_TTL_MIN - 2 (margin so the
          # report enqueues before the SIGTERM). Keep in sync with
          # timeout-minutes above.
          WORKER_TTL_MIN: '50'
          # T46/W-B §1c + W-D D1: MODE=real model chain head (OPTIONAL repo
          # variable — empty/absent = the free-lane defaults in worker/
          # turn.mjs; the chain is [this, nvidia/nemotron-3.5-lightning:free,
          # deepseek/deepseek-v4-flash-0731:free, cohere/north-mini-code:free]
          # with ONE fallback hop on infra-class failure. D1 retired the old
          # dots-studio head (0% content at the production shape) and
          # nemotron-3-ultra (p95 32s + the 30s burst-wall class).
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || '' }}
          # T46/W-D (D3 + B1): MODE=real key pool — comma-joined free-tier OR
          # keys (secret, registry order). Non-empty pool => the real lane's
          # key is pool[fnv1a(task_id) % pool.length] with rotate-class (429
          # quota + 401/402 dead-key) rotation per hop (M5 + the W-D review
          # fold, worker/turn.mjs); OPENROUTER_API_KEY stays
          # the cc/paid lane's primary (the pool serves the FREE lane only).
          # Empty/absent = today's single-key behavior, bit-for-bit.
          OPENROUTER_KEY_POOL: ${{ secrets.OPENROUTER_KEY_POOL || '' }}
          # T46/W4 §1d (D2): MODE=cc lanes — the KEY POOL (secret #7 primary,
          # #6 secondary; empty/absent lanes are simply not in the pool) and
          # the model chain head (OPTIONAL repo variable CC_MODEL; empty = the
          # free-lane defaults in worker/cc-adapter.mjs). The CLI pin
          # (OPTIONAL CC_VERSION, default 2.1.273 — the adapter's M-4 pin,
          # s21/W2: the INSTALL step above defaults to the SAME literal, and
          # asserts the installed version matches) + the determinism mode
          # (CC_FAKE_LLM — NEVER in live dispatches) complete the env surface.
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          CC_MODEL: ${{ vars.CC_MODEL || '' }}
          CC_VERSION: ${{ vars.CC_VERSION || '' }}
          # s24/B3 (D7a): the codex lane's CODEX_HOME — NOT mapped here: the
          # codex-install step above exports it via GITHUB_ENV
          # ($HOME/.codex-fsm — GitHub's env mapping cannot expand $HOME), so
          # it reaches this process's env exactly where the adapter reads it
          # (codex-adapter.mjs's env.CODEX_HOME resolution). The codex lane
          # reuses BOTH OpenRouter key secrets above (D14: the SAME pool —
          # the lane overlay re-injects the serving key per lane); the CLI
          # pin rides vars.CODEX_VERSION at the INSTALL step only (the adapter
          # spawns the installed binary — no version argv).
          # T46/W4 → s25/b1: the transcript push rides the CONTENTS API now
          # (the X29 F3 race fix — worker/sessions-push.mjs, per-file CAS,
          # race-free at any parallelism). The X20 run-1 lesson still holds:
          # without a token lane the turn reports infra
          # 'transcript-push-failed' — FSM_SESSIONS_TOKEN above IS that lane
          # (the job token by default, the PAT when TARGET_REPO redirects —
          # the ephemeral job token cannot push cross-repo).
          EVENT: ${{ toJSON(github.event) }}
        run: node worker/turn.mjs
