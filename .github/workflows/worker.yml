# fsm-worker — the agent seat. One run = one task attempt.
#
# Receives the turn envelope via fsm-task dispatch (client_payload). T46/W-B
# §1c MODE routing (worker/turn.mjs):
#   mode=mock (default) — the deterministic harness shim (sim/harness-shim.mjs):
#     CP.behavior drives the seeded behavior set (fast/slow/poison/infra-flaky/
#     deadline/hang/dup-report/wb-violation + the legacy vocabulary as aliases).
#   mode=real — one OpenRouter completion on the env-driven model chain
#     (OPENROUTER_MODEL, then the free defaults) with one fallback hop on
#     infra-class failure, bounded by budget.lane_attempts.
#   mode=cc — the CC adapter (worker/cc-adapter.mjs, T46/W4): the
#     claude-code CLI turn on the key-pool × model-chain lanes (D2), the
#     F-M8 OpenRouter bridge env, the process-group wall kill at the
#     deadline, transcripts to fsm-sessions BEFORE the report, the
#     write-back door on artifacts. CC_FAKE_LLM=1 swaps the CLI for
#     worker/fake-cc.mjs (deterministic fixtures — never set in live
#     dispatches; the X20 smoke is the only real-lane execution).
# EVERY mode passes the LAW-1 START-GATE first (envelopeFromDispatch): an
# already-expired deadline → one infra_failed 'late-start' report, exit 0 —
# the lease is never burned on a guaranteed orphan.
#
# NEVER writes state and NEVER dispatches — it reports by CAS-appending a
# line to state/reports-queue.jsonl (data through git; the tick drains it
# atomically). The lease token in the report is the validity claim:
# stale/duplicate reports are absorbed by the conductor (orphan/dedup).
# If the enqueue itself fails (after retry), the payload is written to the
# run's step summary (the visible-waste lane) and the run exits 2.
#
# TTL wall: timeout-minutes kills hangs; the CONDUCTOR's lease deadline is
# the semantic backstop (retry / quarantine). The job dying "successfully
# but silent" (no-report behavior) is a first-class failure class the FSM
# handles by design — this is the at-least-once contract.
#
# T45/F-G(e) — the TTL-kill SIGNATURE (porting contract): a timeout-minutes
# kill presents as conclusion=CANCELLED (NOT failure) with a step duration ≈
# timeout-minutes (live datum 34073438112: step 20m03s, cancelled). In-lab
# the lease/quarantine path is the handler BY DESIGN — the run conclusion is
# cosmetic; any failure-watch porting this contract must count
# cancelled-at-TTL as the kill class.
#
# T44/X14: 20min >= lease(15, real lane) + report margin. The real-LLM lane
# runs with lease_minutes=15 (configure control) — mock lane lease is 4min
# but a generous job TTL costs nothing on a public repo and removes the
# spurious-kill class entirely.
name: fsm-worker

run-name: "task-${{ github.event.client_payload.task }} · ${{ github.event.client_payload.behavior }} · a${{ github.event.client_payload.attempt }}"

on:
  repository_dispatch:
    types: [fsm-task]

concurrency:
  group: fsm-worker-${{ github.event.client_payload.task }}
  # SUPERSESSION semantics: a reassigned attempt (newer lease) CANCELS the
  # older hanging run for the same task — the retry supersedes, and a hung
  # runner dies at reassignment instead of blocking its replacement for the
  # full timeout window.
  cancel-in-progress: true

permissions:
  contents: write   # the report-queue CAS push (git push via the checkout creds)

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # >= real-lane lease (15) + report margin (X14)
    steps:
      - uses: actions/checkout@v4

      - name: Work the task
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # T45/F-E: GITHUB_RUN_ID is STABLE across re-runs — only the attempt
          # increments. The report id is attempt-scoped (rep-<run>-a<attempt>)
          # so a re-run's report is never dedup-swallowed. GITHUB_RUN_ATTEMPT
          # IS a default env var, but the mapping keeps the contract explicit.
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          # T45/F-G(a): the mock sleep cap = WORKER_TTL_MIN - 2 (margin so the
          # report enqueues before the SIGTERM). Keep in sync with
          # timeout-minutes above.
          WORKER_TTL_MIN: '20'
          # T46/W-B §1c: MODE=real model chain head (OPTIONAL repo variable —
          # empty/absent = the free-lane defaults in worker/turn.mjs; the
          # chain is [this, dots-studio/dots-3-note-preview:free,
          # nvidia/nemotron-3-ultra-550b-a55b:free, cohere/north-mini-code:free]
          # with ONE fallback hop on infra-class failure).
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || '' }}
          # T46/W4 §1d (D2): MODE=cc lanes — the KEY POOL (secret #7 primary,
          # #6 secondary; empty/absent lanes are simply not in the pool) and
          # the model chain head (OPTIONAL repo variable CC_MODEL; empty = the
          # free-lane defaults in worker/cc-adapter.mjs). The CLI pin
          # (OPTIONAL CC_VERSION, default 'latest') + the determinism mode
          # (CC_FAKE_LLM — NEVER in live dispatches) complete the env surface.
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          CC_MODEL: ${{ vars.CC_MODEL || '' }}
          CC_VERSION: ${{ vars.CC_VERSION || '' }}
          EVENT: ${{ toJSON(github.event) }}
        run: node worker/turn.mjs
